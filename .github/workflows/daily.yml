name: 申万菱信债基每日收蛋

on:
  schedule:
    # 北京时间 20:00 / 20:30 / 21:00 三个时段兜底。
    # GitHub 的 cron 在高峰期常被延迟（近期实测延迟 4~5 小时、甚至直接跳过），
    # 单点 20:00 靠不住，所以铺三个时段：任一次跑成功即推送，
    # 脚本内置去重（同一净值日只推一次完整版），多跑不会重复打扰。
    - cron: '0 12 * * *'
    - cron: '30 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: '强制再次推送钉钉（当天已推过时用于更正数据）'
        type: boolean
        default: false
      with_retry:
        description: '启用重试（净值未出时每5分钟重试至21:45）'
        type: boolean
        default: false

# 同一时间只跑一个，避免多个时段的运行互相覆盖 egg-data.json
concurrency:
  group: swsmu-debt-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行脚本
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FORCE_PUSH: ${{ github.event.inputs.force_push == 'true' && '1' || '' }}
        run: |
          if [ "${{ github.event.inputs.with_retry }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python swsmu_debt_daily.py --with-retry
          else
            python swsmu_debt_daily.py
          fi

      - name: 提交 egg-data.json 更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add egg-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 更新收蛋数据 $(date +%Y-%m-%d)"
            git push
          fi
